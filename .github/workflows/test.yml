name: Run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # The default name, without the values the include entry below adds
    name: build (${{ matrix.go }}, ${{ matrix.firebird-version }})

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23', '1.27']
        firebird-version: ['2.5-sc', '2.5-ss', '3', '4', '5']
        include:
          - firebird-version: '2.5-sc'
            firebird-image: 'jacobalberty/firebird:2.5-sc'
          - firebird-version: '2.5-ss'
            firebird-image: 'jacobalberty/firebird:2.5-ss'
          - firebird-version: '3'
            firebird-image: 'firebirdsql/firebird:3'
          - firebird-version: '4'
            firebird-image: 'firebirdsql/firebird:4'
          - firebird-version: '5'
            firebird-image: 'firebirdsql/firebird:5'
          # Firebird 3 with AuthServer = Srp, its own default. A login without wire
          # encryption asks for Srp256, the server switches to Srp, and SRP finishes
          # after the attach. The default AuthServer below has every plugin the
          # driver asks for, and it never switches. One Go version is enough: keep it
          # the newest one above.
          - go: '1.27'
            firebird-version: '3-srp'
            firebird-image: 'firebirdsql/firebird:3'
            auth-server: 'Srp'
            require-plugin-switch: '1'

    services:
      firebird:
        image: ${{ matrix.firebird-image }}
        volumes:
          - /tmp:/tmp
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_ROOT_PASSWORD: masterkey
          # Same settings as _attic/firebird.conf, except AuthServer in 3-srp
          FIREBIRD_CONF_AuthServer: ${{ matrix.auth-server || 'Srp256, Srp, Legacy_Auth' }}
          FIREBIRD_CONF_WireCrypt: Enabled
          FIREBIRD_CONF_DefaultTimeZone: GMT
        ports:
          - 3050:3050
        # The job waits until the server accepts connections inside the container
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/3050'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - name: Build
      run: go build -v ./...
    - name: Test
      env:
        ISC_USER: SYSDBA
        ISC_PASSWORD: masterkey
        FIREBIRDSQL_TRACE_TEST: "1"
        # Makes the plugin-switch tests fail instead of skip when there is no switch
        FIREBIRDSQL_REQUIRE_PLUGIN_SWITCH: ${{ matrix.require-plugin-switch }}
      run: |
        go test -race -count=1 -v ./...
